name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Home Assistant ships monthly and this integration has broken on API
  # drift before, so check weekly even when nothing is committed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Current Home Assistant requires 3.14 or newer.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Validates manifest.json: required keys, well-formed URLs, sane
      # requirements and version.
      - uses: home-assistant/actions/hassfest@master
